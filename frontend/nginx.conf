server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /healthz {
    proxy_pass http://api:8080;
  }

  location / {
    try_files $uri /index.html;
  }
}
